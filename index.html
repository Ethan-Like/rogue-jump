<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#17213a">
  <title>肉鸽跳一跳</title>
  <style>
    :root {
      color-scheme: dark;
      --ink: #f7fbff;
      --muted: rgba(247, 251, 255, 0.66);
      --glass: rgba(13, 24, 43, 0.58);
      --glass-strong: rgba(10, 18, 34, 0.84);
      --line: rgba(255, 255, 255, 0.16);
      --accent: #ffd166;
      --mint: #74e0a9;
      --pink: #ff5f86;
      --blue: #7bd8ff;
      --app-width: 100vw;
      --app-height: 100dvh;
      --hud-side: 22px;
      --hud-left: max(var(--hud-side), env(safe-area-inset-left));
      --hud-right: max(var(--hud-side), env(safe-area-inset-right));
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-drag: none;
      -webkit-user-select: none;
      user-select: none;
    }

    [hidden] {
      display: none !important;
    }

    html,
    body {
      width: var(--app-width);
      min-width: var(--app-width);
      height: var(--app-height);
      min-height: var(--app-height);
      margin: 0;
      overflow: hidden;
      background: #111a31;
      color: var(--ink);
      font-family: ui-rounded, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
      touch-action: none;
      overscroll-behavior: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    body {
      position: fixed;
      top: 0;
      left: 0;
    }

    #game {
      position: fixed;
      top: 0;
      left: 0;
      width: var(--app-width);
      height: var(--app-height);
      display: block;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }

    .hud {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      left: var(--hud-left);
      right: var(--hud-right);
      z-index: 4;
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: start;
      gap: 10px;
      pointer-events: none;
    }

    .status {
      display: grid;
      gap: 5px;
      justify-items: start;
      min-width: 0;
    }

    .chip {
      min-height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 6px 9px;
      background: var(--glass);
      box-shadow: 0 10px 28px rgba(3, 8, 20, 0.22);
      backdrop-filter: blur(14px);
      font-size: 13px;
      line-height: 1;
      white-space: nowrap;
    }

    .chip strong {
      font-weight: 800;
      letter-spacing: 0;
    }

    .hearts {
      color: #ff6f91;
      text-shadow: 0 2px 10px rgba(255, 95, 134, 0.35);
      font-size: 16px;
      letter-spacing: 1px;
    }

    .ability-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 4px;
      max-width: min(56vw, 260px);
    }

    .ability-tag {
      height: 22px;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 7px;
      padding: 3px 6px;
      background: rgba(13, 24, 43, 0.48);
      box-shadow: 0 8px 18px rgba(3, 8, 20, 0.16);
      backdrop-filter: blur(12px);
      color: rgba(247, 251, 255, 0.78);
      font-size: 11px;
      line-height: 1;
      white-space: nowrap;
    }

    .ability-icon {
      color: var(--accent);
      font-size: 12px;
      font-weight: 900;
      line-height: 1;
    }

    .scorebox {
      display: grid;
      gap: 6px;
      justify-items: end;
      font-size: 12px;
      color: var(--muted);
      text-align: right;
      min-width: 0;
    }

    .scorebox b {
      color: var(--ink);
      font-size: 22px;
      line-height: 1;
      font-weight: 900;
      font-variant-numeric: tabular-nums;
    }

    .best-record {
      max-width: min(58vw, 270px);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .best-name {
      display: inline-block;
      max-width: min(24vw, 100px);
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: bottom;
      color: rgba(247, 251, 255, 0.86);
      font-weight: 800;
    }

    .test-toggle {
      pointer-events: auto;
      height: 32px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 4px 7px 4px 9px;
      background: var(--glass);
      box-shadow: 0 10px 28px rgba(3, 8, 20, 0.22);
      backdrop-filter: blur(14px);
      color: rgba(247, 251, 255, 0.78);
      font-size: 12px;
      line-height: 1;
      white-space: nowrap;
      touch-action: manipulation;
    }

    .test-toggle input {
      position: absolute;
      opacity: 0;
      pointer-events: none;
    }

    .switch-track {
      position: relative;
      width: 34px;
      height: 20px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.16);
      box-shadow: inset 0 1px 6px rgba(0, 0, 0, 0.28);
      transition: background 150ms ease;
    }

    .switch-track::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #f7fbff;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.32);
      transition: transform 150ms ease;
    }

    .test-toggle input:checked + .switch-track {
      background: linear-gradient(90deg, #74e0a9, #ffd166);
    }

    .test-toggle input:checked + .switch-track::after {
      transform: translateX(14px);
    }

    .charge-meter {
      position: fixed;
      left: 50%;
      bottom: max(24px, env(safe-area-inset-bottom) + 20px);
      z-index: 5;
      width: min(calc(var(--app-width) - var(--hud-left) - var(--hud-right)), 480px);
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 9px 11px;
      background: rgba(9, 18, 34, 0.62);
      box-shadow: 0 16px 38px rgba(3, 8, 20, 0.28);
      backdrop-filter: blur(16px);
      color: rgba(247, 251, 255, 0.78);
      font-size: 13px;
      font-weight: 900;
      line-height: 1;
      pointer-events: none;
      opacity: 0;
      transform: translate(-50%, 10px);
      transition: opacity 150ms ease, transform 150ms ease;
    }

    .charge-meter.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .charge-track {
      position: relative;
      height: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      box-shadow: inset 0 1px 7px rgba(0, 0, 0, 0.34);
      overflow: hidden;
    }

    .charge-fill {
      position: absolute;
      top: 2px;
      bottom: 2px;
      left: 2px;
      width: 0%;
      border-radius: 999px;
      background: linear-gradient(90deg, #74e0a9, #ffd166 62%, #ff6f91);
      box-shadow: 0 0 14px rgba(255, 209, 102, 0.42);
    }

    .charge-state {
      min-width: 30px;
      text-align: right;
      color: rgba(247, 251, 255, 0.7);
    }

    body.compact-ui {
      --hud-side: 20px;
    }

    body.compact-ui .hud {
      top: max(8px, env(safe-area-inset-top));
    }

    body.compact-ui .chip {
      min-height: 28px;
      padding: 5px 8px;
      font-size: 12px;
    }

    body.compact-ui .hearts {
      font-size: 15px;
    }

    body.compact-ui .scorebox {
      gap: 4px;
      font-size: 11px;
    }

    body.compact-ui .scorebox b {
      font-size: 20px;
    }

    body.compact-ui .test-toggle {
      height: 29px;
      padding: 4px 6px 4px 8px;
      font-size: 11px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(max(86px, env(safe-area-inset-bottom) + 84px));
      z-index: 5;
      max-width: min(82vw, 390px);
      transform: translate(-50%, 12px);
      opacity: 0;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 10px 13px;
      color: var(--ink);
      background: rgba(8, 16, 31, 0.76);
      box-shadow: 0 18px 44px rgba(3, 8, 20, 0.35);
      backdrop-filter: blur(16px);
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
      pointer-events: none;
      transition: opacity 170ms ease, transform 170ms ease;
    }

    .toast.show {
      opacity: 1;
      transform: translate(-50%, 0);
    }

    .guide-button {
      position: fixed;
      right: max(20px, env(safe-area-inset-right) + 16px);
      bottom: max(22px, env(safe-area-inset-bottom) + 18px);
      z-index: 6;
      min-width: 62px;
      height: 38px;
      border: 1px solid rgba(226, 255, 230, 0.45);
      border-radius: 999px;
      padding: 0 15px;
      background: linear-gradient(180deg, #7bef83, #28ae4c);
      box-shadow: 0 12px 28px rgba(14, 73, 31, 0.36), inset 0 1px 0 rgba(255, 255, 255, 0.45);
      color: #062312;
      font: inherit;
      font-size: 14px;
      font-weight: 950;
      line-height: 1;
      text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
      pointer-events: auto;
      touch-action: manipulation;
    }

    .guide-button:active {
      transform: translateY(1px) scale(0.98);
    }

    .guide-layer {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      overflow: hidden;
      padding: max(30px, env(safe-area-inset-top) + 16px) 22px max(24px, env(safe-area-inset-bottom) + 18px);
      color: var(--ink);
      background:
        linear-gradient(180deg, rgba(8, 13, 25, 0.76), rgba(3, 6, 12, 0.90)),
        radial-gradient(circle at 50% 20%, rgba(123, 216, 255, 0.22), rgba(123, 216, 255, 0) 42%),
        rgba(9, 16, 30, 0.94);
      pointer-events: auto;
    }

    .guide-layer.show {
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 14px;
    }

    .guide-title {
      margin: 0;
      color: #fff7c9;
      font-size: clamp(34px, 10vw, 54px);
      line-height: 0.98;
      font-weight: 950;
      text-align: center;
      text-shadow:
        0 3px 0 #1c416a,
        0 6px 0 #7c4a22,
        0 14px 24px rgba(0, 0, 0, 0.45);
    }

    .guide-subtitle {
      margin: 7px 0 0;
      color: rgba(247, 251, 255, 0.72);
      font-size: 13px;
      line-height: 1.35;
      text-align: center;
    }

    .guide-flow {
      position: relative;
      min-height: 0;
      display: grid;
      align-content: center;
      gap: 30px;
      justify-items: center;
      max-width: 500px;
      width: 100%;
      margin: 0 auto;
    }

    .guide-card {
      position: relative;
      width: min(94%, 420px);
      display: grid;
      grid-template-columns: 54px 1fr;
      align-items: center;
      gap: 11px;
      min-height: 82px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-radius: 8px;
      padding: 10px 12px;
      background: rgba(10, 20, 38, 0.72);
      box-shadow: 0 18px 36px rgba(0, 0, 0, 0.28);
      backdrop-filter: blur(16px);
    }

    .guide-icon {
      width: 54px;
      height: 54px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: linear-gradient(150deg, #ffe57a, #ff835f);
      box-shadow: 0 9px 18px rgba(255, 131, 95, 0.22);
      color: #16223b;
      font-size: 25px;
      font-weight: 950;
      line-height: 1;
    }

    .guide-card:nth-child(2) .guide-icon {
      background: linear-gradient(150deg, #7bd8ff, #74e0a9);
    }

    .guide-card:nth-child(3) .guide-icon {
      background: linear-gradient(150deg, #ff87a8, #ffd166);
    }

    .guide-card:nth-child(4) .guide-icon {
      background: linear-gradient(150deg, #a9f58c, #52c4ff);
    }

    .guide-card-title {
      display: block;
      margin-bottom: 4px;
      font-size: 16px;
      line-height: 1.2;
      font-weight: 950;
      color: #fff;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.34);
    }

    .guide-card-text {
      display: block;
      color: rgba(247, 251, 255, 0.72);
      font-size: 12px;
      line-height: 1.35;
    }

    .guide-continue {
      width: min(100%, 360px);
      height: 48px;
      justify-self: center;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #fff7c9;
      font: inherit;
      font-size: 26px;
      line-height: 1;
      font-weight: 950;
      text-shadow: 0 3px 0 #1c416a, 0 8px 20px rgba(0, 0, 0, 0.46);
      touch-action: manipulation;
    }

    @media (max-height: 720px) {
      .guide-layer {
        padding-top: max(22px, env(safe-area-inset-top) + 10px);
        padding-bottom: max(18px, env(safe-area-inset-bottom) + 12px);
        gap: 8px;
      }

      .guide-title {
        font-size: clamp(29px, 8.5vw, 43px);
      }

      .guide-subtitle {
        margin-top: 5px;
        font-size: 12px;
      }

      .guide-flow {
        gap: 9px;
      }

      .guide-card {
        width: min(96%, 390px);
        min-height: 68px;
        grid-template-columns: 44px 1fr;
        gap: 9px;
        padding: 8px 10px;
      }

      .guide-icon {
        width: 44px;
        height: 44px;
        font-size: 20px;
      }

      .guide-card-title {
        margin-bottom: 3px;
        font-size: 14px;
      }

      .guide-card-text {
        font-size: 11px;
      }

      .guide-continue {
        height: 40px;
        font-size: 22px;
      }
    }

    .choice-layer,
    .record-layer,
    .retry-layer {
      position: fixed;
      inset: 0;
      z-index: 8;
      display: none;
      align-items: end;
      justify-content: center;
      padding: 18px;
      padding-bottom: max(18px, env(safe-area-inset-bottom));
      background: linear-gradient(180deg, rgba(5, 9, 19, 0.10), rgba(5, 9, 19, 0.72));
      pointer-events: auto;
    }

    .record-layer {
      z-index: 9;
      align-items: center;
      background: linear-gradient(180deg, rgba(5, 9, 19, 0.22), rgba(5, 9, 19, 0.82));
    }

    .retry-layer {
      z-index: 9;
      align-items: center;
      background: linear-gradient(180deg, rgba(5, 9, 19, 0.16), rgba(5, 9, 19, 0.78));
    }

    .choice-layer.show,
    .record-layer.show,
    .retry-layer.show {
      display: flex;
    }

    .retry-layer .panel {
      width: min(86vw, 360px);
      text-align: center;
    }

    .retry-layer .panel-head {
      padding: 26px 22px;
      border-bottom: 0;
    }

    .panel {
      width: min(100%, 450px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      background: rgba(9, 18, 34, 0.88);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.46);
      backdrop-filter: blur(22px);
      overflow: hidden;
    }

    .panel-head {
      display: grid;
      gap: 5px;
      padding: 16px 16px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
    }

    .panel-kicker {
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0;
    }

    .panel-title {
      font-size: 22px;
      line-height: 1.15;
      font-weight: 900;
      letter-spacing: 0;
    }

    .panel-copy {
      color: rgba(247, 251, 255, 0.68);
      font-size: 13px;
      line-height: 1.45;
    }

    .choices {
      display: grid;
      gap: 10px;
      padding: 12px;
    }

    .choice {
      width: 100%;
      display: grid;
      grid-template-columns: 38px 1fr;
      gap: 10px;
      align-items: center;
      min-height: 76px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      padding: 11px 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.065);
      font: inherit;
      text-align: left;
      touch-action: manipulation;
    }

    .choice:active {
      transform: translateY(1px);
      background: rgba(255, 255, 255, 0.11);
    }

    .choice-mark {
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border-radius: 8px;
      background: linear-gradient(150deg, rgba(255, 209, 102, 0.95), rgba(255, 95, 134, 0.88));
      color: #17213a;
      font-weight: 950;
      box-shadow: 0 10px 22px rgba(255, 95, 134, 0.24);
    }

    .choice:nth-child(2) .choice-mark {
      background: linear-gradient(150deg, rgba(123, 216, 255, 0.96), rgba(116, 224, 169, 0.88));
    }

    .choice-title {
      display: block;
      font-weight: 900;
      font-size: 15px;
      line-height: 1.25;
      margin-bottom: 4px;
    }

    .choice-text {
      display: block;
      color: rgba(247, 251, 255, 0.68);
      font-size: 12px;
      line-height: 1.35;
    }

    .record-body {
      display: grid;
      gap: 12px;
      padding: 14px;
    }

    .record-input {
      width: 100%;
      height: 44px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 8px;
      padding: 0 12px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.08);
      font: inherit;
      font-size: 16px;
      outline: none;
      -webkit-user-select: text;
      user-select: text;
    }

    .record-input:focus {
      border-color: rgba(255, 209, 102, 0.62);
      box-shadow: 0 0 0 3px rgba(255, 209, 102, 0.12);
    }

    .record-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .record-button {
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 8px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.07);
      font: inherit;
      font-weight: 900;
      touch-action: manipulation;
    }

    .record-button.primary {
      border-color: rgba(255, 209, 102, 0.42);
      background: linear-gradient(150deg, rgba(255, 209, 102, 0.96), rgba(255, 95, 134, 0.86));
      color: #17213a;
    }

    .record-button:active {
      transform: translateY(1px);
    }

    @media (min-width: 720px) {
      .choice-layer,
      .record-layer,
      .retry-layer {
        align-items: center;
        padding: 28px;
      }

      .panel {
        width: min(74vw, 560px);
      }

      .panel-head {
        gap: 8px;
        padding: 24px 26px 20px;
      }

      .panel-kicker {
        font-size: 15px;
      }

      .panel-title {
        font-size: 30px;
      }

      .panel-copy {
        font-size: 17px;
      }

      .choices {
        gap: 16px;
        padding: 18px;
      }

      .choice {
        grid-template-columns: 56px 1fr;
        gap: 16px;
        min-height: 110px;
        padding: 18px 20px;
      }

      .choice-mark {
        width: 56px;
        height: 56px;
        font-size: 22px;
      }

      .choice-title {
        font-size: 21px;
        margin-bottom: 7px;
      }

      .choice-text {
        font-size: 16px;
        line-height: 1.45;
      }

      .record-body {
        gap: 16px;
        padding: 20px;
      }

      .record-input {
        height: 54px;
        padding: 0 16px;
        font-size: 20px;
      }

      .record-actions {
        gap: 14px;
      }

      .record-button {
        height: 52px;
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <canvas id="game" aria-label="肉鸽跳一跳游戏画面"></canvas>

  <div class="hud" aria-hidden="true">
    <div class="status">
      <div class="chip hearts" id="hearts">♥ ♥ ♥</div>
      <div class="ability-bar" id="abilityBar" hidden></div>
    </div>
    <div class="scorebox">
      <label class="test-toggle" aria-label="无限生命模式">
        <span>无限生命</span>
        <input id="infiniteLifeToggle" type="checkbox">
        <span class="switch-track" aria-hidden="true"></span>
      </label>
      <span class="best-record">最高分记录：<span class="best-name" id="bestName">匿名</span> <span id="bestScore">0</span></span>
      <b id="score">1</b>
    </div>
  </div>

  <div class="charge-meter" id="chargeMeter" hidden aria-hidden="true">
    <span>蓄力</span>
    <span class="charge-track" aria-hidden="true">
      <span class="charge-fill" id="chargeFill"></span>
    </span>
    <span class="charge-state" id="chargeState">待命</span>
  </div>

  <button class="guide-button" id="guideButton" type="button" hidden>玩法</button>

  <div class="guide-layer" id="guideLayer" aria-hidden="true">
    <div>
      <h1 class="guide-title">肉鸽跳一跳</h1>
      <p class="guide-subtitle">按住、松手、落稳，每一次选择都会改变后面的路。</p>
    </div>

      function getAudioContext() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        if (!audioState.context) {
          audioState.context = new AudioContextClass();
        }
        return audioState.context;
      }

      function loadRawSfx(name) {
        const config = sfxConfig[name];
        if (!config) return Promise.reject(new Error(`Unknown sfx: ${name}`));
        if (audioState.raw[name]) return Promise.resolve(audioState.raw[name]);
        if (!audioState.loadingRaw[name]) {
          audioState.loadingRaw[name] = fetch(config.url)
            .then(response => {
              if (!response.ok) throw new Error(`Failed to load ${config.url}`);
              return response.arrayBuffer();
            })
            .then(buffer => {
              audioState.raw[name] = buffer;
              return buffer;
            })
            .catch(error => {
              console.warn(error);
              audioState.loadingRaw[name] = null;
              return null;
            });
        }
        return audioState.loadingRaw[name];
      }

      function decodeSfx(name) {
        const context = getAudioContext();
        if (!context) return Promise.resolve(null);
        if (audioState.buffers[name]) return Promise.resolve(audioState.buffers[name]);
        if (!audioState.decoding[name]) {
          audioState.decoding[name] = loadRawSfx(name)
            .then(raw => raw ? context.decodeAudioData(raw.slice(0)) : null)
            .then(buffer => {
              if (buffer) audioState.buffers[name] = buffer;
              return buffer;
            })
            .catch(error => {
              console.warn(error);
              audioState.decoding[name] = null;
              return null;
            });
        }
        return audioState.decoding[name];
      }

      function unlockAudio() {
        const context = getAudioContext();
        if (context) {
          if (context.state === "suspended") context.resume();
          decodeSfx("jump");
          decodeSfx("land");
          decodeSfx("fall");
        }
        startMusic();
      }

      function playSfx(name, volumeScale = 1) {
        const context = getAudioContext();
        const config = sfxConfig[name];
        if (!context || !config) return;
        if (context.state === "suspended") context.resume();
        const start = buffer => {
          if (!buffer) return;
          const source = context.createBufferSource();
          const gain = context.createGain();
          gain.gain.value = config.volume * volumeScale;
          source.buffer = buffer;
          source.connect(gain);
          gain.connect(context.destination);
          source.start();
        };
        const buffer = audioState.buffers[name];
        if (buffer) {
          start(buffer);
        } else {
          decodeSfx(name).then(start);
        }
      }

      function playCheer(kind = "art") {
        const context = getAudioContext();
        if (!context) return;
        if (context.state === "suspended") context.resume();

        const nowMs = performance.now();
        const minGap = kind === "choice" ? 120 : 280;
        if (nowMs - audioState.lastCheerAt < minGap) return;
        audioState.lastCheerAt = nowMs;

        const notes = kind === "choice"
          ? [
            [523.25, 0, 0.11],
            [659.25, 0.08, 0.13],
            [880, 0.17, 0.18]
          ]
          : [
            [783.99, 0, 0.09],
            [1174.66, 0.07, 0.12]
          ];
        const baseVolume = kind === "choice" ? 0.052 : 0.038;
        const startTime = context.currentTime + 0.01;

        notes.forEach(([frequency, offset, duration], index) => {
          const oscillator = context.createOscillator();
          const gain = context.createGain();
          const t = startTime + offset;
          oscillator.type = index === notes.length - 1 ? "sine" : "triangle";
          oscillator.frequency.setValueAtTime(frequency, t);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.exponentialRampToValueAtTime(baseVolume * (1 - index * 0.08), t + 0.018);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + duration);
          oscillator.connect(gain);
          gain.connect(context.destination);
          oscillator.start(t);
          oscillator.stop(t + duration + 0.03);
        });
      }

      function getMusicElement() {
        if (!audioState.music) {
          const music = new Audio(musicConfig.url);
          music.preload = "auto";
          music.loop = false;
          music.volume = 0;
          music.addEventListener("timeupdate", () => {
            if (music.currentTime >= musicConfig.loopEnd) {
              music.currentTime = 0;
            }
          });
          audioState.music = music;
        }
        return audioState.music;
      }

      function fadeMusicTo(targetVolume, duration = musicConfig.fadeMs) {
        const music = getMusicElement();
        const startVolume = music.volume;
        const startTime = performance.now();
        cancelAnimationFrame(audioState.musicFadeFrame);
        const step = now => {
          const progress = clamp((now - startTime) / duration, 0, 1);
          music.volume = lerp(startVolume, targetVolume, easeOutCubic(progress));
          if (progress < 1) {
            audioState.musicFadeFrame = requestAnimationFrame(step);
          }
        };
        audioState.musicFadeFrame = requestAnimationFrame(step);
      }

      function startMusic() {
        const music = getMusicElement();
        if (audioState.musicStarted && !music.paused) return;
        audioState.musicStarted = true;
        const started = music.play();
        if (started?.then) {
          started
            .then(() => fadeMusicTo(musicConfig.volume))
            .catch(error => {
              console.warn(error);
              audioState.musicStarted = false;
            });
        } else {
          fadeMusicTo(musicConfig.volume);
        }
      }

      function getViewportSize() {
        const visual = window.visualViewport;
        const layoutWidth = document.documentElement.clientWidth || window.innerWidth || 0;
        return {
          width: Math.round(Math.max(layoutWidth, window.innerWidth || 0, visual?.width || 0)),
          height: Math.round(visual?.height || window.innerHeight || document.documentElement.clientHeight)
        };
      }

      function resize() {
        state.dpr = clamp(window.devicePixelRatio || 1, 1, 2.4);
        const viewport = getViewportSize();
        state.width = viewport.width;
        state.height = viewport.height;
        document.documentElement.style.setProperty("--app-width", `${state.width}px`);
        document.documentElement.style.setProperty("--app-height", `${state.height}px`);
        document.body.classList.toggle("compact-ui", state.height < 760);
        state.scale = clamp(state.width / 390, 0.82, 1.12);
        canvas.width = Math.round(state.width * state.dpr);
        canvas.height = Math.round(state.height * state.dpr);
        canvas.style.width = state.width + "px";
        canvas.style.height = state.height + "px";
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);

      function resetGame(keepBest = true) {

      function createInitialPlatforms() {
        state.platforms.push({
          index: 0,
          x: 0,
          y: 0,
          baseSize: 100,
          tint: 0,
          phase: rand(0, Math.PI * 2),

          sizeDelta: 0,
          motion: "none",
          special: null

        ensurePlatforms(32);
